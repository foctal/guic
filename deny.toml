[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
# Accepted advisories are pinned by ID so every new advisory still
# fails CI and the local release gate. See docs/dependency-policy.md.
ignore = [
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0057",
    "RUSTSEC-2026-0173",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0206",
    # Temporary: retired zvariant/zbus_names crates remain in the pinned Linux
    # accessibility and notification stacks, pending a zbus migration decision.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]
yanked = "warn"

[bans]
multiple-versions = "warn"
# Workspace dependencies use intentionally broad semver requirements while the
# application workspace is reproducibly pinned by Cargo.lock.
wildcards = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "NCSA",
    "OFL-1.1",
    "Unicode-3.0",
    "Zlib",
    "bzip2-1.0.6",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Reviewed certificate data introduced by cargo-packager's rustls backend.
# The full agreement is shipped in crates/cargo-guic/THIRD-PARTY-LICENSES.txt.
[[licenses.exceptions]]
name = "webpki-roots"
version = "=1.0.10"
allow = ["CDLA-Permissive-2.0"]

# Certificate data used by the fork's reqwest/ureq platform verifier.
# Its agreement is shipped in both packager and updater archives.
[[licenses.exceptions]]
name = "webpki-root-certs"
version = "=1.0.11"
allow = ["CDLA-Permissive-2.0"]

# Reviewed StatusNotifierItem implementation for GPUI's non-GTK Linux desktop.
# The public-domain dedication and warranty text are included in guic-native.
[[licenses.exceptions]]
name = "ksni"
version = "=0.3.6"
allow = ["Unlicense"]
