[package]
name = "guic-packager-resource-resolver"
description = "Cargo packager resource resolver"
version = "0.1.0"
authors = ["CrabNebula Ltd."]
edition = "2021"
license = "Apache-2.0 OR MIT"
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
features = [ "auto-detect-format" ]

[dependencies]
thiserror = "2"
guic-packager-utils = { version = "0.1.0", path = "../guic-packager-utils", default-features = false }
log = "0.4"
heck = "0.5"

[features]
process-relaunch-dangerous-allow-symlink-macos = [ "guic-packager-utils/process-relaunch-dangerous-allow-symlink-macos" ]
auto-detect-format = [ ]
